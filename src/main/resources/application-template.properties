spring.application.name=saudemz
spring.datasource.url=${SAUDEMZ_DB_URL}
spring.datasource.username=${SAUDEMZ_DB_USERNAME}
spring.datasource.password=${SAUDEMZ_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SAUDEMZ_MAIL_USERNAME}
spring.mail.password=${SAUDEMZ_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
